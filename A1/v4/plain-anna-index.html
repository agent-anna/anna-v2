<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENT ANNA V3 // A1 WORKBENCH</title>
    <style>
        :root {
            --bg-void: #05080f;
            --bg-panel: #0a101d;
            --bg-card: #0e172a;
            --border-subtle: #1e293b;
            --border-accent: #00f0ff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-gold: #fbbf24;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg-void);
            color: var(--text-main);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            overflow: hidden;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }

        .top-left, .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-main);
        }

        .status-badge.ok {
            border-color: var(--accent-emerald);
            color: #6ee7b7;
        }

        .status-badge.err {
            border-color: var(--accent-rose);
            color: #fda4af;
        }

        button, select, input {
            font-family: inherit;
            font-size: 12px;
            color: var(--text-main);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 6px 10px;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            border-color: var(--accent-cyan);
        }

        .action-chip {
            padding: 5px 9px;
            font-size: 11px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            border-radius: 4px;
        }

        .action-chip.active-mode {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .swallow-btn {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .del-btn {
            border-color: var(--accent-rose);
            color: #fda4af;
        }

        #settings-panel {
            display: none;
            padding: 12px 14px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-accent);
        }

        .settings-grid {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .main-workbench {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        .left-panel {
            width: 38%;
            min-width: 280px;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-subtle);
            background: var(--bg-panel);
            min-height: 0;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }

        #repo-tree-view {
            flex: 1;
            overflow: auto;
            padding: 8px 10px;
            font-size: 12px;
            min-height: 120px;
        }

        #repo-file-grid {
            display: none;
            flex: 1;
            overflow: auto;
            padding: 8px 10px;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }

        .repo-file-card {
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .file-card-name {
            font-size: 11px;
            word-break: break-all;
        }

        .file-card-size {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .tree-folder-row {
            cursor: pointer;
            padding: 3px 4px;
            user-select: none;
            color: var(--accent-gold);
        }

        .tree-children {
            padding-left: 14px;
        }

        .tree-file {
            display: block;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 3px;
            color: var(--text-main);
        }

        .tree-file:hover {
            background: var(--bg-card);
            color: var(--accent-cyan);
        }

        .editor-box {
            display: flex;
            flex-direction: column;
            height: 45%;
            min-height: 180px;
            border-top: 1px solid var(--border-subtle);
            padding: 8px 10px;
            gap: 6px;
        }

        #repo-code-editor {
            flex: 1;
            width: 100%;
            resize: none;
            background: var(--bg-void);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 8px;
        }

        #media-preview-container {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: center;
            overflow: auto;
            background: var(--bg-void);
            border: 1px solid var(--border-subtle);
        }

        #media-preview-container img,
        #media-preview-container video {
            max-width: 100%;
            max-height: 100%;
        }

        #delete-warning-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 8px;
            background: #3f111c;
            border: 1px solid var(--accent-rose);
            border-radius: 4px;
            font-size: 11px;
        }

        .right-console {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--bg-void);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            border: 1px solid var(--border-subtle);
            background: var(--bg-panel);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .message.assistant {
            border-color: #164e63;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            cursor: pointer;
        }

        .msg-content {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 13px;
        }

        .msg-content.collapsed {
            display: none;
        }

        .action-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .quick-bar {
            display: flex;
            gap: 6px;
            padding: 6px 14px;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-panel);
            flex-wrap: wrap;
        }

        .input-bar {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-panel);
        }

        #user-input {
            flex: 1;
            min-width: 0;
        }

        #mic-btn.listening {
            border-color: var(--accent-rose);
            color: var(--accent-rose);
        }

        body.is-fullpage .left-panel {
            display: none !important;
        }

        body.is-fullpage .right-console {
            width: 100% !important;
            max-width: 100% !important;
            flex: 1 1 100% !important;
        }

        body.is-fullpage #chat-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            font-size: 15px;
        }

        body.is-fullpage .msg-content {
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body class="is-standby">
    <div class="app-shell">
        <header class="top-bar">
            <div class="top-left">
                <span id="state-text" class="status-badge">STANDBY // AGENT ANNA V3</span>
                <span id="vault-status" class="status-badge">V3 FILES: 0 (CTX: 0)</span>
                <span id="key-status" class="status-badge err">KEY: MISSING</span>
            </div>
            <div class="top-right">
                <select id="model-select" onchange="window.updateActiveModel()" aria-label="Select Dahl Model">
                    <option value="MiniMaxAI/MiniMax-M2.7">MiniMaxAI/MiniMax-M2.7</option>
                    <option value="deepseek-ai/DeepSeek-V3">deepseek-ai/DeepSeek-V3</option>
                </select>
                <button id="voice-btn" class="action-chip" onclick="window.toggleVoice()">VOICE: ON</button>
                <button id="fullpage-btn" class="action-chip" onclick="window.toggleFullPageMode()" aria-pressed="false">FULL PAGE</button>
                <button class="action-chip" onclick="window.toggleSettings()">KEYS</button>
            </div>
        </header>

        <section id="settings-panel">
            <div class="settings-grid">
                <input id="api-key" type="password" placeholder="DAHL_API_KEY" autocomplete="off">
                <input id="gh-token" type="password" placeholder="GITHUB_PAT" autocomplete="off">
                <button class="action-chip swallow-btn" onclick="window.saveCredentials()">SAVE &amp; SYNC</button>
                <button class="action-chip" onclick="window.toggleSettings()">CLOSE</button>
            </div>
        </section>

        <div class="main-workbench">
            <aside class="left-panel" aria-label="A1/v3 File Tree and Editor">
                <div class="panel-header">
                    <span>A1/v3 WORKSPACE</span>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button id="view-toggle-btn" class="action-chip" onclick="window.toggleViewMode()">VIEW: TREE</button>
                        <button class="action-chip" onclick="window.syncAll()">SYNC</button>
                        <button class="action-chip" onclick="window.auditActiveFile()">AUDIT</button>
                        <button class="action-chip swallow-btn" onclick="window.commitCurrentFile()">COMMIT</button>
                        <button class="action-chip del-btn" onclick="window.promptDeleteFile()">DELETE</button>
                    </div>
                </div>

                <div id="repo-tree-view" role="tree" aria-label="A1/v3 file tree"></div>
                <div id="repo-file-grid" role="list" aria-label="A1/v3 file grid"></div>

                <div class="editor-box">
                    <input id="active-file-path" type="text" placeholder="Active file path inside A1/v3/...">
                    <div id="delete-warning-banner">
                        <span id="delete-warning-text">DELETE FILE PERMANENTLY?</span>
                        <div style="display:flex;gap:6px;">
                            <button class="action-chip del-btn" onclick="window.confirmDeleteFile()">CONFIRM</button>
                            <button class="action-chip" onclick="window.cancelDeleteFile()">CANCEL</button>
                        </div>
                    </div>
                    <textarea id="repo-code-editor" placeholder="Select a file in Tree or Grid to view or edit..."></textarea>
                    <div id="media-preview-container"></div>
                </div>
            </aside>

            <main class="right-console" aria-label="Agent Anna Console">
                <div class="panel-header">
                    <span>CONSOLE // AGENT ANNA V3</span>
                    <div style="display:flex;gap:6px;">
                        <button class="action-chip" onclick="window.triggerAutonomousBootSequence()">AWAKEN</button>
                        <button class="action-chip" onclick="window.clearLogs()">CLEAR</button>
                    </div>
                </div>

                <div id="chat-container" role="log" aria-live="polite"></div>

                <div class="quick-bar">
                    <button class="action-chip" onclick="window.fetchLatestBackendReport(true)">READ LAST LOG</button>
                    <button class="action-chip" onclick="window.dispatchScrapeWorkflow('https://martinstrayd.github.io/artist/', 'strayd-artist-live', 'url')">RUN ARTIST FEED</button>
                    <button class="action-chip" onclick="window.triggerPreset('Summarize all files currently loaded in your A1/v3 context.')">SUMMARIZE V3</button>
                </div>

                <div class="input-bar">
                    <button id="mic-btn" class="action-chip" onclick="window.toggleMicrophone()" aria-label="Toggle Microphone">MIC</button>
                    <input id="user-input" type="text" placeholder="Ask Anna about A1/v3, memory, tasks, or logs..." onkeydown="window.handleKey(event)">
                    <button class="action-chip swallow-btn" onclick="window.sendMessage()">SEND</button>
                </div>
            </main>
        </div>
    </div>

    <script src="./anna-v3-ui.js?v=3.14"></script>
</body>
</html>
