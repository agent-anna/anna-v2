<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A1/strayd • Anna Studio Queue & Trigger</title>
  <style>
    :root { --bg:#0b0e14; --panel:#121722; --panel-2:#182030; --text:#eef2f7; --muted:#9aa6bd; --accent:#7dd3fc; --ok:#a3e635; --border:rgba(255,255,255,0.1); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; }
    h1 { margin:0; font-size:1.1rem; }
    .sub { color:var(--muted); font-size:0.84rem; }
    .grid { max-width:1180px; margin:20px auto; padding:0 20px 40px; display:grid; grid-template-columns:340px 1fr; gap:20px; }
    @media (max-width:860px) { .grid { grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
    label { display:block; font-size:0.78rem; color:var(--muted); margin-bottom:5px; }
    input, select, textarea, button { width:100%; border-radius:8px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); padding:8px 10px; font-size:0.88rem; }
    textarea { min-height:84px; font-family:ui-monospace,monospace; font-size:0.8rem; }
    button { cursor:pointer; background:var(--accent); color:#071018; font-weight:700; border:none; margin-top:8px; }
    button.secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
    .art-wrap { display:grid; grid-template-columns:170px 1fr; gap:16px; align-items:start; }
    @media (max-width:640px) { .art-wrap { grid-template-columns:1fr; } }
    .art-box { aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:#090c12; border:1px solid var(--border); }
    .art-box img { width:100%; height:100%; object-fit:cover; display:block; }
    .pill { display:inline-block; font-size:0.74rem; padding:2px 9px; border-radius:999px; background:rgba(163,230,53,0.14); color:var(--ok); margin-bottom:8px; }
    .status { font-size:0.82rem; color:var(--muted); margin-top:8px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>A1/strayd • Queue &amp; Promo Runner</h1>
      <div class="sub">Outside A1/v4 core • Reads &amp; updates A1/strayd/promo-queue.json • Uses martinstrayd/artist/store-art/</div>
    </div>
    <div class="sub"><code>agent-anna/anna-v2/A1/strayd/</code></div>
  </header>
  <div class="grid">
    <div>
      <section class="card">
        <div class="pill">QUEUE SELECTOR</div>
        <label for="queueSelect">Queued Song / Topic</label>
        <select id="queueSelect"></select>
        <button id="reloadQueueBtn" class="secondary">Reload promo-queue.json from GitHub</button>
        <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px;">
          <label for="newTitle">Add Song or Topic to Queue</label>
          <input id="newTitle" placeholder="e.g. Andaman Escape or Chiang Mai Morning Set" />
          <label for="newLink" style="margin-top:8px;">Direct Link (used on X; omitted from Facebook body)</label>
          <input id="newLink" value="https://www.paypal.com/paypalme/martinstrayd" />
          <button id="addItemBtn">Generate &amp; Queue Drafts (Reach Rules Applied)</button>
        </div>
        <div id="statusBox" class="status">Ready.</div>
      </section>

      <section class="card">
        <div class="pill">OPTIONAL ONLINE QUEUE SAVE</div>
        <label for="ghToken">GitHub Token (session only, not stored)</label>
        <input id="ghToken" type="password" placeholder="Paste repo contents token to push queue" />
        <button id="pushQueueBtn" class="secondary">Commit Queue Changes to A1/strayd/promo-queue.json</button>
      </section>
    </div>

    <section class="card">
      <div class="pill">READY FOR ANNA TO REVIEW, EDIT, OR SEND</div>
      <div class="art-wrap">
        <div class="art-box"><img id="artPreview" alt="Cover Art" /></div>
        <div>
          <h2 id="itemHeading" style="margin:0 0 4px;font-size:1.2rem;"></h2>
          <div id="artFileLabel" class="sub" style="margin-bottom:10px;word-break:break-all;"></div>
          <label for="fbDraft">Facebook Draft (No URL in body, max 2 hashtags)</label>
          <textarea id="fbDraft"></textarea>
          <button class="secondary" data-copy="fbDraft">Copy Facebook Draft</button>

          <label for="xDraft" style="margin-top:10px;">X / Short Post Draft (Max 2 hashtags)</label>
          <textarea id="xDraft"></textarea>
          <button class="secondary" data-copy="xDraft">Copy X Draft</button>

          <label for="reelDraft" style="margin-top:10px;">Reel Caption (Realistic visual notes, no cartoon, max 4 hashtags)</label>
          <textarea id="reelDraft"></textarea>
          <button class="secondary" data-copy="reelDraft">Copy Reel Caption</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const REPO_API = "https://api.github.com/repos/agent-anna/anna-v2/contents/A1/strayd/promo-queue.json";
    const RAW_QUEUE = "https://raw.githubusercontent.com/agent-anna/anna-v2/main/A1/strayd/promo-queue.json";
    let queueData = {
      version: 1,
      scope: "A1/strayd (outside A1/v4 core)",
      artBase: "https://raw.githubusercontent.com/martinstrayd/artist/main/store-art/",
      items: []
    };

    const queueSelect = document.getElementById("queueSelect");
    const itemHeading = document.getElementById("itemHeading");
    const artFileLabel = document.getElementById("artFileLabel");
    const artPreview = document.getElementById("artPreview");
    const fbDraft = document.getElementById("fbDraft");
    const xDraft = document.getElementById("xDraft");
    const reelDraft = document.getElementById("reelDraft");
    const statusBox = document.getElementById("statusBox");

    function setStatus(msg) { statusBox.textContent = msg; }

    function buildDrafts(title, link) {
      const cleanLink = (link || "https://www.paypal.com/paypalme/martinstrayd").trim();
      return {
        facebook: `"${title}" — Martin Strayd. Personal digital MP3 + artwork edition (own & share with friends, no commercial resale). Say hi if you want the direct link. #MartinStrayd`,
        x: `"${title}" — Martin Strayd. MP3 + cover art edition, own & share with friends. ${cleanLink} #MartinStrayd`,
        reel: `Realistic live/location cut for "${title}" — Martin Strayd. Direct MP3 + artwork edition (share with friends, no resale). #MartinStrayd #IndieMusic`
      };
    }

    function syncCurrentEditsToModel() {
      const idx = Number(queueSelect.value || 0);
      const item = queueData.items[idx];
      if (!item) return;
      item.drafts = {
        facebook: fbDraft.value.trim(),
        x: xDraft.value.trim(),
        reel: reelDraft.value.trim()
      };
    }

    function renderSelected(selectIndex) {
      if (!queueData.items.length) {
        itemHeading.textContent = "No queued items yet";
        artFileLabel.textContent = "";
        artPreview.removeAttribute("src");
        fbDraft.value = "";
        xDraft.value = "";
        reelDraft.value = "";
        return;
      }
      const idx = Math.max(0, Math.min(queueData.items.length - 1, Number(selectIndex ?? queueSelect.value ?? 0)));
      queueSelect.innerHTML = "";
      queueData.items.forEach((it, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = `${i + 1}. ${it.title} [${it.status || "ready"}]`;
        if (i === idx) opt.selected = true;
        queueSelect.appendChild(opt);
      });
      const item = queueData.items[idx];
      const base = (queueData.artBase || "https://raw.githubusercontent.com/martinstrayd/artist/main/store-art/").replace(/\/?$/, "/");
      const artFile = item.artFile || `Martin Strayd - ${item.title}.png`;
      itemHeading.textContent = item.title;
      artFileLabel.textContent = `store-art/${artFile}`;
      artPreview.src = base + encodeURIComponent(artFile);
      fbDraft.value = item.drafts?.facebook || "";
      xDraft.value = item.drafts?.x || "";
      reelDraft.value = item.drafts?.reel || "";
    }

    async function loadQueue() {
      setStatus("Loading A1/strayd/promo-queue.json...");
      try {
        const res = await fetch(`${RAW_QUEUE}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (Array.isArray(data.items)) {
          queueData = data;
          renderSelected(0);
          setStatus(`Loaded ${queueData.items.length} item(s) from A1/strayd/promo-queue.json.`);
        }
      } catch (err) {
        setStatus(`Could not fetch remote queue (${err.message}). Using local queue state.`);
        renderSelected(0);
      }
    }

    queueSelect.addEventListener("change", () => {
      renderSelected(Number(queueSelect.value));
    });

    [fbDraft, xDraft, reelDraft].forEach(el => {
      el.addEventListener("input", syncCurrentEditsToModel);
    });

    document.getElementById("reloadQueueBtn").addEventListener("click", loadQueue);

    document.getElementById("addItemBtn").addEventListener("click", () => {
      syncCurrentEditsToModel();
      const title = document.getElementById("newTitle").value.trim();
      if (!title) { setStatus("Enter a song or topic title first."); return; }
      const link = document.getElementById("newLink").value.trim();
      const nextNum = String(queueData.items.length + 1).padStart(3, "0");
      queueData.items.push({
        id: `item-${nextNum}`,
        title,
        artFile: `Martin Strayd - ${title}.png`,
        status: "ready",
        drafts: buildDrafts(title, link)
      });
      document.getElementById("newTitle").value = "";
      renderSelected(queueData.items.length - 1);
      setStatus(`Added "${title}" to queue (${queueData.items.length} total).`);
    });

    document.querySelectorAll("button[data-copy]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const target = document.getElementById(btn.getAttribute("data-copy"));
        try {
          await navigator.clipboard.writeText(target.value);
          setStatus(`Copied ${btn.getAttribute("data-copy")} to clipboard.`);
        } catch {
          setStatus("Copy manually from the textarea.");
        }
      });
    });

    document.getElementById("pushQueueBtn").addEventListener("click", async () => {
      syncCurrentEditsToModel();
      const token = document.getElementById("ghToken").value.trim();
      if (!token) { setStatus("Paste a GitHub token with contents write access to commit."); return; }
      setStatus("Checking current sha and pushing A1/strayd/promo-queue.json...");
      try {
        const headers = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" };
        let sha = null;
        const getRes = await fetch(`${REPO_API}?ref=main`, { headers });
        if (getRes.ok) {
          const meta = await getRes.json();
          sha = meta.sha;
        }
        const jsonStr = JSON.stringify(queueData, null, 2);
        const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
        const body = { message: "Update A1/strayd/promo-queue.json via studio.html", content: b64, branch: "main" };
        if (sha) body.sha = sha;
        const putRes = await fetch(REPO_API, {
          method: "PUT",
          headers: { ...headers, "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!putRes.ok) throw new Error(`PUT HTTP ${putRes.status}`);
        const out = await putRes.json();
        setStatus(`Committed A1/strayd/promo-queue.json @ ${out.commit.sha.slice(0, 7)}`);
      } catch (err) {
        setStatus(`Commit failed: ${err.message}`);
      }
    });

    loadQueue();
  </script>
</body>
</html>
