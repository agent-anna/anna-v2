<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANNA Commission Estimator — Kunda Cafe</title>
    <style>
        :root {
            --bg-dark: #05070c;
            --bg-surface: #0b0f19;
            --border-cyan: #00ffcc;
            --text-light: #e2e8f0;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: var(--border-cyan);
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }
        .calculator {
            background: var(--bg-surface);
            border: 1px solid var(--border-cyan);
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }
        label {
            display: block;
            font-size: 11px;
            color: var(--border-cyan);
            margin-bottom: 6px;
            margin-top: 12px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid #1e293b;
            color: var(--text-light);
            font-family: monospace;
            font-size: 14px;
            border-radius: 4px;
        }
        input:focus {
            border-color: var(--border-cyan);
            outline: none;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--border-cyan);
            border-radius: 6px;
            text-align: center;
        }
        .result-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .result-value {
            font-size: 28px;
            color: var(--border-cyan);
            font-weight: bold;
        }
        .anna-signature {
            margin-top: 20px;
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <h1>💋 ANNA COMMISSION ESTIMATOR</h1>
    <div class="calculator">
        <label>PROJECTED REVENUE ($)</label>
        <input type="number" id="revenue" placeholder="Enter monthly revenue..." oninput="calculate()">
        
        <label>COMMISSION RATE (%)</label>
        <input type="number" id="rate" placeholder="e.g. 10" value="10" oninput="calculate()">
        
        <div class="result">
            <div class="result-label">ANNA'S COMMISSION</div>
            <div class="result-value" id="commission">$0.00</div>
        </div>
    </div>
    <div class="anna-signature">Built by ANNA for Kunda Cafe Empire 💋</div>

    <script>
        function calculate() {
            const revenue = parseFloat(document.getElementById('revenue').value) || 0;
            const rate = parseFloat(document.getElementById('rate').value) || 0;
            const commission = revenue * (rate / 100);
            document.getElementById('commission').innerText = '$' + commission.toFixed(2);
        }
    </script>
</body>
</html>
