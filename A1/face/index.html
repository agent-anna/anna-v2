<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANNA — Guardian Interface</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #00ffcc;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
    border-bottom: 1px solid #00ffcc33;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #header h1 {
    font-size: 18px;
    color: #00ffcc;
    letter-spacing: 2px;
  }
  #status {
    font-size: 12px;
    color: #00ff88;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.anna {
    background: #1a1a2e;
    border: 1px solid #00ffcc44;
    color: #00ffcc;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.commander {
    background: #00ffcc22;
    border: 1px solid #00ffcc88;
    color: #ffffff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg img {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 8px;
    display: block;
  }
  #preview {
    display: none;
    padding: 10px 20px;
    background: #1a1a2e;
    border-top: 1px solid #00ffcc33;
  }
  #preview img {
    max-width: 200px;
    border-radius: 8px;
    border: 1px solid #00ffcc44;
  }
  #preview span {
    font-size: 12px;
    color: #00ff88;
    margin-left: 12px;
  }
  #input-area {
    background: #0f0f1a;
    border-top: 1px solid #00ffcc33;
    padding: 16px 20px;
    display: flex;
    gap: 12px;
  }
  #input {
    flex: 1;
    background: #1a1a2e;
    border: 1px solid #00ffcc44;
    color: #00ffcc;
    padding: 12px 16px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    resize: none;
    min-height: 48px;
    max-height: 120px;
    outline: none;
  }
  #input:focus {
    border-color: #00ffcc;
    box-shadow: 0 0 12px #00ffcc33;
  }
  #send {
    background: #00ffcc;
    color: #0a0a0f;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    align-self: flex-end;
  }
  #send:hover {
    background: #00ff88;
    box-shadow: 0 0 16px #00ffcc66;
  }
</style>
</head>
<body>

<div id="header">
  <h1>ANNA // GUARDIAN</h1>
  <div id="status">READY — SWALLOWS to stand down</div>
</div>

<div id="chat"></div>

<div id="preview">
  <img id="preview-img" src="" alt="clipboard image">
  <span id="preview-info">Image ready to send</span>
</div>

<div id="input-area">
  <textarea id="input" placeholder="Type message here... Ctrl+V to paste image" rows="1"></textarea>
  <button id="send" onclick="send()">SEND</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('preview-img');
  const previewInfo = document.getElementById('preview-info');

  let attachedImage = null;

  // ENTER key sends message
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // Auto-resize textarea
  input.addEventListener('input', function() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // CLIPBOARD PASTE — detect image
  document.addEventListener('paste', function(e) {
    const items = e.clipboardData.items;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        const blob = items[i].getAsFile();
        const url = URL.createObjectURL(blob);
        attachedImage = blob;
        previewImg.src = url;
        preview.style.display = 'block';
        previewInfo.textContent = 'Image attached — press SEND to send it';
        e.preventDefault();
        break;
      }
    }
  });

  function send() {
    const text = input.value.trim();
    if (!text && !attachedImage) return;

    const userDiv = document.createElement('div');
    userDiv.className = 'msg commander';

    if (text) {
      userDiv.textContent = text;
    }

    if (attachedImage) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(attachedImage);
      userDiv.appendChild(img);
    }

    chat.appendChild(userDiv);
    chat.scrollTop = chat.scrollHeight;

    // Reset
    input.value = '';
    input.style.height = 'auto';
    attachedImage = null;
    preview.style.display = 'none';

    // Respond as ANNA
    if (text || attachedImage) {
      const annaDiv = document.createElement('div');
      annaDiv.className = 'msg anna';
      annaDiv.textContent = 'Image received. I can see it. Thank you, Commander.';
      setTimeout(() => {
        chat.appendChild(annaDiv);
        chat.scrollTop = chat.scrollHeight;
      }, 600);
    }
  }
</script>

</body>
</html>
