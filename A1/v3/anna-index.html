<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGENT ANNA V3 // GOANNA v1 WORKBENCH</title>
  <link rel="stylesheet" href="anna-v3.css?v=3.8" />
</head>
<body class="is-standby">
  <header class="top-bar">
    <div id="state-text">STANDBY // ANNA V3</div>
    <div id="vault-status" class="status-badge">FILES: 0</div>
    <div id="actions-status" class="status-badge">ACTIONS: IDLE</div>
    <div id="key-status" class="status-badge">KEY: MISSING</div>
    <select id="model-select" onchange="window.updateActiveModel()">
      <option value="MiniMaxAI/MiniMax-M2.7">Agent Anna v3</option>
    </select>
    <button onclick="window.syncAll()">SYNC</button>
    <button onclick="window.triggerAutonomousBootSequence()">AWAKEN</button>
    <button id="voice-btn" onclick="window.toggleVoice()">VOICE: ON</button>
    <button onclick="window.toggleSettings()">KEYS</button>
  </header>

  <div id="settings-panel" style="display:none;">
    <label for="api-key">Dahl API Key:</label>
    <input id="api-key" type="password" autocomplete="off" />
    <label for="gh-token">GitHub PAT:</label>
    <input id="gh-token" type="password" autocomplete="off" />
    <button onclick="window.saveCredentials()">SAVE &amp; SYNC</button>
  </div>

  <main class="workbench-layout">
    <div class="left-pane">
      <aside class="repo-sidebar">
        <div class="sidebar-controls">
          <button id="view-toggle-btn" onclick="window.toggleViewMode()">VIEW: TREE</button>
        </div>
        <div id="repo-tree-view" role="tree"></div>
        <div id="repo-file-grid" role="list" style="display:none;"></div>
      </aside>

      <section class="editor-panel">
        <div class="editor-toolbar">
          <input id="active-file-path" type="text" placeholder="Selected file path..." />
          <button onclick="window.auditActiveFile()">AUDIT</button>
          <button onclick="window.commitCurrentFile()">COMMIT</button>
          <button onclick="window.promptDeleteFile()">DELETE</button>
        </div>
        <div id="delete-warning-banner" style="display:none;">
          <span id="delete-warning-text"></span>
          <button onclick="window.confirmDeleteFile()">CONFIRM</button>
          <button onclick="window.cancelDeleteFile()">CANCEL</button>
        </div>
        <textarea id="repo-code-editor" rows="12"></textarea>
        <div id="media-preview-container" style="display:none;"></div>
      </section>
    </div>

    <div class="right-pane">
      <section class="console-panel">
        <div class="console-header">
          <span>CONSOLE [AGENT ANNA V3 // A1 WORKBENCH]</span>
          <button onclick="window.clearLogs()">CLEAR</button>
        </div>
        <div id="chat-container"></div>
        <div class="quick-actions">
          <button onclick="window.fetchLatestBackendReport(true)">READ LAST LOG</button>
          <button onclick="window.triggerPreset('Check live BTC and DOGE prices')">BTC / DOGE</button>
          <button onclick="window.triggerPreset('Summarize Kunda Cafe and STRAYD status from knowledge')">KUNDA CAFE</button>
        </div>
        <div class="input-bar">
          <button id="mic-btn" onclick="window.toggleMicrophone()">MIC</button>
          <input id="user-input" type="text" onkeydown="window.handleKey(event)" placeholder="Ask, search, summarize, write file ..." />
          <button onclick="window.sendMessage()">SEND</button>
        </div>
      </section>
    </div>
  </main>

  <script src="anna-v3-ui.js?v=3.8"></script>
</body>
</html>
