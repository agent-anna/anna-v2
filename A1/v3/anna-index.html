<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANNA V3 — Workbench</title>
  <style>
    :root {
      --bg:       #0f0e0c;
      --surface:  #171510;
      --border:   #2c2820;
      --gold:     #c9a84c;
      --gold-dim: #7a6330;
      --gold-bg:  #1c180e;
      --text:     #cec3aa;
      --muted:    #5e5844;
      --pass:     #5cb85c;
      --fail:     #d4605e;
      --info:     #7ab8c4;
      --mono:     "Courier New", "Lucida Console", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    #header h1 {
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #header span {
      color: var(--muted);
      font-size: 11px;
    }
    .spacer { flex: 1; }

    /* ── Main ───────────────────────────────────────── */
    #main {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Config row ─────────────────────────────────── */
    #config-row {
      display: flex;
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-wrap: wrap;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 2px;
      outline: none;
      width: 220px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--gold-dim); }
    input::placeholder { color: var(--muted); }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }
    button {
      background: var(--gold-bg);
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-family: var(--mono);
      font-size: 11px;
      padding: 7px 18px;
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }
    button:hover {
      background: var(--gold);
      color: var(--bg);
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.outline {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }
    button.outline:hover {
      background: var(--surface);
      color: var(--text);
    }

    /* ── Output ─────────────────────────────────────── */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      font-size: 12px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 0;
    }
    .line { display: block; }
    .line.log   { color: var(--text); }
    .line.pass  { color: var(--pass); }
    .line.fail  { color: var(--fail); }
    .line.gold  { color: var(--gold); }
    .line.muted { color: var(--muted); }
    .line.info  { color: var(--info); }

    /* ── Input bar ──────────────────────────────────── */
    #input-bar {
      display: flex;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    #chat-input {
      flex: 1;
      background: var(--bg);
      border: none;
      border-right: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 10px 14px;
      outline: none;
      resize: none;
    }
    #chat-input::placeholder { color: var(--muted); }
    #send-btn {
      background: var(--gold-bg);
      border: none;
      color: var(--gold);
      font-family: var(--mono);
      font-size: 11px;
      padding: 0 22px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.15s;
    }
    #send-btn:hover { background: var(--gold); color: var(--bg); }
  </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────── -->
  <div id="header">
    <h1>ANNA V3</h1>
    <span>Workbench</span>
    <span class="spacer"></span>
    <span id="status" style="font-size:10px;color:var(--muted);letter-spacing:1px;">READY</span>
  </div>

  <!-- ── Main ────────────────────────────────────────── -->
  <div id="main">

    <!-- ── Config row ───────────────────────────────── -->
    <div id="config-row">
      <div class="field">
        <label>GitHub Owner</label>
        <input id="gh-owner"   type="text"     placeholder="agent-anna" spellcheck="false" />
      </div>
      <div class="field">
        <label>GitHub Repo</label>
        <input id="gh-repo"    type="text"     placeholder="anna-v2"     spellcheck="false" />
      </div>
      <div class="field">
        <label>GitHub Branch</label>
        <input id="gh-branch"  type="text"     placeholder="main"        spellcheck="false" />
      </div>
      <div class="field">
        <label>GitHub Token</label>
        <input id="gh-token"   type="password" placeholder="ghp_••••••"    spellcheck="false" />
      </div>
      <div class="field">
        <label>Dahl Endpoint</label>
        <input id="dahl-ep"    type="text"     placeholder="https://api.dahl.ai/…" spellcheck="false" />
      </div>
      <div class="field">
        <label>Dahl Model</label>
        <input id="dahl-model" type="text"     placeholder="gpt-4o"        spellcheck="false" />
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="dahl-key"   type="password" placeholder="sk-••••••"     spellcheck="false" />
      </div>
      <div class="btn-group">
        <button id="btn-verify">Verify Modules</button>
        <button id="btn-clear" class="outline">Clear</button>
      </div>
    </div>

    <!-- ── Output ────────────────────────────────────── -->
    <div id="output"></div>

    <!-- ── Input bar ─────────────────────────────────── -->
    <div id="input-bar">
      <textarea id="chat-input" placeholder="Send a message… (ENTER to send)" rows="1" spellcheck="false"></textarea>
      <button id="send-btn">Send</button>
    </div>

  </div><!-- /main -->

  <!-- ── Scripts: exact dependency order ─────────── -->
  <script src="./functions/utils.js"></script>
  <script src="./functions/github.js"></script>
  <script src="./functions/memory.js"></script>
  <script src="./functions/telemetry.js"></script>
  <script src="./functions/brain.js"></script>
  <script src="./functions/chat.js"></script>
  <script src="./smoke-test.js"></script>

  <script>
    /* ─────────────────────────────────────────────────────
       ANNA V3 Workbench — UI Logic
       All config held in memory only. Zero writes to repo.
    ───────────────────────────────────────────────────── */
    const output   = document.getElementById('output');
    const chatIn   = document.getElementById('chat-input');
    const sendBtn  = document.getElementById('send-btn');
    const btnVerify = document.getElementById('btn-verify');
    const btnClear  = document.getElementById('btn-clear');
    const status   = document.getElementById('status');

    /* ── Session-only config (never persisted) ──────── */
    let sessionConfig = {};

    function captureConfig() {
      sessionConfig = {
        github: {
          owner:  document.getElementById('gh-owner').value.trim(),
          repo:   document.getElementById('gh-repo').value.trim(),
          branch: document.getElementById('gh-branch').value.trim() || 'main',
          token:  document.getElementById('gh-token').value.trim(),
        },
        dahl: {
          endpoint: document.getElementById('dahl-ep').value.trim(),
          model:    document.getElementById('dahl-model').value.trim() || 'gpt-4o',
          apiKey:   document.getElementById('dahl-key').value.trim(),
        },
      };
    }

    /* ── Output helpers ─────────────────────────────── */
    function out(text, cls = 'log') {
      const el = document.createElement('span');
      el.className = `line ${cls}`;
      el.textContent = text;
      output.appendChild(el);
      output.appendChild(document.createElement('br'));
      output.scrollTop = output.scrollHeight;
    }
    const log   = (t) => out(t, 'log');
    const pass  = (t) => out('✅ ' + t, 'pass');
    const fail  = (t) => out('❌ ' + t, 'fail');
    const info  = (t) => out('ℹ  ' + t, 'info');
    const gold  = (t) => out(t, 'gold');
    const muted = (t) => out(t, 'muted');

    /* ── Verify Modules (no token required) ─────────── */
    btnVerify.addEventListener('click', () => {
      captureConfig();
      info('Running module verification (no token required)…');
      log('');
      btnVerify.disabled = true;

      // Run the read-only verifyModules check
      if (typeof smokeTest !== 'undefined' && smokeTest.verifyModules) {
        smokeTest.verifyModules();
        log('');
        info('Module verification complete.');
      } else {
        fail('smokeTest or smokeTest.verifyModules not found.');
      }

      btnVerify.disabled = false;
    });

    /* ── Clear ──────────────────────────────────────── */
    btnClear.addEventListener('click', () => {
      output.innerHTML = '';
      gold('╔══════════════════════════════════════════╗');
      gold('║       ANNA V3 Workbench Initialized      ║');
      gold('╚══════════════════════════════════════════╝');
      muted('All inputs held in session only. No repo writes.');
      log('');
    });

    /* ── Chat send ──────────────────────────────────── */
    function doSend() {
      const text = chatIn.value.trim();
      if (!text) return;
      log('> ' + text);
      chatIn.value = '';
      muted('Chat.send() — wire to Chat.send() in chat.js');
    }

    sendBtn.addEventListener('click', doSend);
    chatIn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        doSend();
      }
    });

    /* ── Boot banner ────────────────────────────────── */
    (() => {
      gold('╔══════════════════════════════════════════╗');
      gold('║       ANNA V3 Workbench Initialized      ║');
      gold('╚══════════════════════════════════════════╝');
      muted('All inputs held in session only. No repo writes.');
      log('');
      muted('Click "Verify Modules" to check module exports (no token needed).');
      log('');
    })();
  </script>
</body>
</html>
