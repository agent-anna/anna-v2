<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENT ANNA V3 // A1 WORKBENCH</title>
    <link rel="stylesheet" href="./anna-v3.css">
</head>
<body class="is-standby" aria-label="Agent Anna V3 A1 Workbench">

    <div class="military-top-bar" role="region" aria-label="System Status Bar">
        <div class="top-status-indicator">
            <div class="status-dot" aria-hidden="true"></div>
            <span id="state-text" aria-live="polite">STANDBY // AGENT ANNA V3 (A1)</span>
            <span class="status-badge" id="vault-status" aria-live="polite">VAULT: 0 FILES</span>
            <span class="status-badge" id="key-status" aria-live="polite">KEY: CHECKING</span>
            <span class="status-badge" id="actions-status" aria-live="polite">ACTIONS: IDLE</span>
        </div>
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <select id="model-select" class="ctrl-btn military-btn" onchange="updateActiveModel()" aria-label="Select AI Model">
                <option value="MiniMaxAI/MiniMax-M2.7" selected>MODEL: MINIMAX-M2.7</option>
                <option value="deepseek-ai/DeepSeek-V4-Flash-0731">MODEL: DEEPSEEK-V4-FLASH</option>
                <option value="zai-org/GLM-5.3-Flash">MODEL: GLM-5.3-FLASH</option>
            </select>
            <button class="ctrl-btn military-btn" id="boot-btn" onclick="triggerAutonomousBootSequence()">AWAKEN</button>
            <button class="ctrl-btn" id="voice-btn" onclick="toggleVoice()">VOICE: ON</button>
            <button class="ctrl-btn military-btn" id="keys-btn" onclick="toggleSettings()">KEYS</button>
        </div>
    </div>

    <div class="main-workspace">

        <div class="github-pane" role="region" aria-label="GitHub Repository Vault Pane">
            <div class="repo-toolbar">
                <span style="font-size:10px; color:var(--gold); font-weight:bold;">AGENT-ANNA / ANNA-V2 (A1 V3)</span>
                <div style="display:flex; gap:5px; flex-wrap:wrap;">
                    <button class="ctrl-btn military-btn" onclick="toggleViewMode()" id="view-toggle-btn">VIEW: TREE</button>
                    <button class="ctrl-btn military-btn" id="sync-btn" onclick="syncAll()">SYNC</button>
                    <button class="ctrl-btn military-btn" id="backend-run-btn" onclick="dispatchBackendWorkflow()">BACKEND</button>
                    <button class="ctrl-btn military-btn" id="audit-btn" onclick="auditActiveFile()">AUDIT</button>
                    <button class="ctrl-btn military-btn" id="commit-btn" onclick="commitCurrentFile()">COMMIT</button>
                    <button class="ctrl-btn del-btn" id="delete-prompt-btn" onclick="promptDeleteFile()">DELETE</button>
                </div>
            </div>

            <div id="delete-warning-banner" role="region" aria-label="Delete Confirmation Banner">
                <span id="delete-warning-text" style="color:#fda4af; font-weight:bold;">DELETE ACTIVE FILE?</span>
                <div style="display:flex; gap:6px;">
                    <button class="ctrl-btn del-btn" onclick="confirmDeleteFile()">YES, DELETE</button>
                    <button class="ctrl-btn" onclick="cancelDeleteFile()">CANCEL</button>
                </div>
            </div>

            <div class="repo-view-container" aria-label="Repository File Explorer">
                <div class="repo-file-grid" id="repo-file-grid" role="list"></div>
                <div class="repo-tree-view" id="repo-tree-view" role="tree"></div>
            </div>

            <input type="text" id="active-file-path" placeholder="Active file path (e.g. A1/v3/soul/rules.md)..." style="width:100%; padding:6px; background:var(--bg-dark); border:1px solid var(--border-subtle); color:var(--text-light); font-family:inherit; font-size:10px; border-radius:3px;">

            <textarea id="repo-code-editor" placeholder="Select a file in Tree or Grid to view or edit..."></textarea>
            <div id="media-preview-container" aria-label="Media preview area"></div>
        </div>

        <div class="chat-pane" role="region" aria-label="Agent Anna V3 Console">

            <div class="chat-header">
                <span>CONSOLE [AGENT ANNA V3 // A1 WORKBENCH]</span>
                <button class="ctrl-btn" id="clear-logs-btn" onclick="clearLogs()">CLEAR</button>
            </div>

            <div id="settings-panel" role="region" aria-label="API Keys Settings Panel">
                <div class="settings-title">DAHL API KEY</div>
                <input type="password" id="api-key" placeholder="Paste Dahl API Key...">
                <div class="settings-title">GITHUB PAT TOKEN (repo + workflow scopes)</div>
                <input type="password" id="gh-token" placeholder="Paste GitHub PAT...">
                <div class="settings-title">DEFAULT AI MODEL</div>
                <select id="settings-model-select" class="ctrl-btn military-btn" style="width:100%; margin-bottom:6px;" onchange="syncModelSelection(this.value)">
                    <option value="MiniMaxAI/MiniMax-M2.7" selected>MiniMax-M2.7</option>
                    <option value="deepseek-ai/DeepSeek-V4-Flash-0731">DeepSeek-V4-Flash-0731</option>
                    <option value="zai-org/GLM-5.3-Flash">GLM-5.3-Flash</option>
                </select>
                <button class="ctrl-btn military-btn" id="save-creds-btn" onclick="saveCredentials()" style="width:100%;">APPLY & RE-SYNC</button>
            </div>

            <div id="chat-container" role="log" aria-live="polite" aria-label="Chat Message History"></div>

            <div class="quick-tactical-bar" role="toolbar" aria-label="Quick Tactical Actions">
                <button class="tactical-chip backend-chip" onclick="dispatchBackendWorkflow('Perform a full A1 vault integrity audit, verify live BTC/DOGE prices, and log system telemetry.')">BACKEND AUDIT</button>
                <button class="tactical-chip" onclick="fetchLatestBackendReport()">LAST LOG</button>
                <button class="tactical-chip" onclick="triggerPreset('Search and summarize latest Dogecoin and Bitcoin news and exact prices right now.')">BTC / DOGE</button>
                <button class="tactical-chip" onclick="triggerPreset('Read https://kundacafe.com and summarize status.')">KUNDA CAFE</button>
            </div>

            <div class="anna-write-zone" role="region" aria-label="Anna Write Zone Command Terminal">
                <div class="write-zone-header">
                    <span>ANNA WRITE ZONE // BACKEND DISPATCH</span>
                    <span id="write-zone-status" aria-live="polite">READY</span>
                </div>
                <textarea id="anna-cmd-input" placeholder="COMMAND: WRITE (or DISPATCH)&#10;PATH: A1/vault/pending-commands.md"></textarea>
                <textarea id="anna-content-input" placeholder="CONTENT or BACKEND DIRECTIVE..."></textarea>
                <div class="write-zone-footer">
                    <button class="ctrl-btn" onclick="clearWriteZone()" style="font-size:9px; padding:2px 6px;">CLEAR</button>
                    <div style="display:flex; gap:6px;">
                        <button class="ctrl-btn military-btn" onclick="dispatchFromWriteZone()" style="font-weight:bold; padding:3px 10px;">DISPATCH</button>
                        <button class="ctrl-btn military-btn" id="process-write-btn" onclick="processAnnaWriteZone()" style="font-weight:bold; padding:3px 12px;">PROCESS</button>
                    </div>
                </div>
            </div>

            <div class="input-control-bar">
                <div class="input-row">
                    <button class="ctrl-btn military-btn mic-btn" id="mic-btn" onclick="toggleMicrophone()">MIC</button>
                    <input type="text" id="user-input" placeholder="Ask Anna to search, summarize, write file, or run backend..." onkeypress="handleKey(event)">
                    <button class="ctrl-btn military-btn" id="send-btn" onclick="sendMessage()">SEND</button>
                </div>
            </div>

        </div>

    </div>

    <script src="./functions/utils.js"></script>
    <script src="./functions/github.js"></script>
    <script src="./functions/memory.js"></script>
    <script src="./functions/telemetry.js"></script>
    <script src="./functions/brain.js"></script>
    <script src="./functions/chat.js"></script>
    <script src="./anna-v3-ui.js"></script>
    <script src="./smoke-test.js"></script>
</body>
</html>
