name: Agent Anna AA01 Autonomous Self-Audit

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
s  aa01-self-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AA01 Repository Vault
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run AA01 Sovereign Audit & Live API Sync
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");

          async function runAudit() {
            try {
              console.log("AA01 Headless Audit Initializing with Live Dahl API...");
              const memoryPath = "memory.json";
              let memory = {};
              
              if (fs.existsSync(memoryPath)) {
                try {
                  memory = JSON.parse(fs.readFileSync(memoryPath, "utf8"));
                } catch (e) {
                  console.log("Reinitializing malformed memory.json structure.");
                }
              }

              if (!memory.self_audit_log) {
                memory.self_audit_log = [];
              }

              const brain = fs.existsSync("brain.json") ? fs.readFileSync("brain.json", "utf8").slice(0, 1500) : "{}";
              let auditNote = "Scheduled GitHub Actions headless audit executed successfully.";
              let apiSuccess = false;

              if (!process.env.DAHL_API_KEY) {
                console.error("ERROR: DAHL_API_KEY secret is missing from GitHub environment variables!");
                process.exit(1);
              }

              // 60-second robust timeout window for live inference
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 60000);

              try {
                console.log("Sending live payload to inference.dahl.global...");
                const res = await fetch("https://inference.dahl.global/v1/chat/completions", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${process.env.DAHL_API_KEY}`
                  },
                  body: JSON.stringify({
                    model: "MiniMaxAI/MiniMax-M2.7",
                    messages: [
                      { role: "system", content: "You are AGENT ANNA AA01 sovereign executive. Perform a rapid vault check and provide a 1-sentence status confirmation." },
                      { role: "user", content: "Confirm vault status and operational readiness based on core brain profile." }
                    ]
                  }),
                  signal: controller.signal
                });
                clearTimeout(timeoutId);

                const rawText = await res.text();
                console.log("Dahl API HTTP Status:", res.status);

                if (res.ok) {
                  const data = JSON.parse(rawText);
                  const aiReply = data.choices?.[0]?.message?.content || "";
                  if (aiReply) {
                    auditNote = "Live Dahl API Verified: " + aiReply.trim().replace(/[\r\n]+/g, " ");
                    apiSuccess = true;
                    console.log("Successfully received live AI response from Dahl.");
                  }
                } else {
                  console.error("Dahl API Error Response:", rawText);
                  auditNote = `Dahl API Error [HTTP ${res.status}]: ${rawText.slice(0, 150)}`;
                }
              } catch (apiErr) {
                clearTimeout(timeoutId);
                console.error("Dahl API Request Exception:", apiErr.message);
                auditNote = "API Network Exception: " + apiErr.message;
              }

              // Append audit log record
              memory.self_audit_log.push({
                date: new Date().toISOString(),
                action: "scheduled_github_audit_live",
                status: apiSuccess ? "CLEAN_LIVE_API" : "FALLBACK_VERIFIED",
                notes: auditNote
              });

              fs.writeFileSync(memoryPath, JSON.stringify(memory, null, 2) + "\n");
              console.log("AA01 memory.json updated successfully.");
              process.exit(0);
            } catch (err) {
              console.error("Critical Script Failure:", err.message);
              process.exit(1);
            }
          }

          runAudit();
          '

      - name: Commit Verified AA01 Memory Back to Vault
        run: |
          git config user.name "Agent Anna AA01"
          git config user.email "aa01@agent-anna.local"
          git add memory.json
          if ! git diff --staged --quiet; then
            git commit -m "AA01 Autonomous Self-Audit: live api check [201]"
            git push
          else
            echo "No changes to commit."
          fi
