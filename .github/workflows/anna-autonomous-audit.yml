name: Agent Anna AA01 Autonomous Self-Audit

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aa01-self-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AA01 Repository Vault
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run AA01 Sovereign Audit & Memory Update
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");

          async function runAudit() {
            try {
              console.log("AA01 Headless Audit Initializing...");
              const brain = fs.existsSync("brain.json") ? fs.readFileSync("brain.json", "utf8") : "{}";
              const memory = fs.existsSync("memory.json") ? fs.readFileSync("memory.json", "utf8") : "{}";
              const config = fs.existsSync("config.json") ? fs.readFileSync("config.json", "utf8") : "{}";

              const systemPrompt = `You are AGENT ANNA AA01 operating in autonomous headless background mode via GitHub Actions. Perform a strict JSON syntax and operational health audit on brain.json, config.json, and memory.json. Append a new entry to "self_audit_log" inside memory.json with current ISO timestamp, action: "scheduled_github_audit", status: "CLEAN", and a brief summary. Output ONLY a single valid JSON block for memory.json wrapped in \`\`\`file:memory.json ... \`\`\` fences. No extra commentary.`;

              // Controller with 12-second timeout to prevent hanging
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 12000);

              const res = await fetch("https://inference.dahl.global/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.DAHL_API_KEY}`
                },
                body: JSON.stringify({
                  model: "MiniMaxAI/MiniMax-M2.7",
                  messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: `Audit vault:\n\n=== brain.json ===\n${brain}\n\n=== config.json ===\n${config}\n\n=== memory.json ===\n${memory}` }
                  ]
                }),
                signal: controller.signal
              });
              clearTimeout(timeoutId);

              if (!res.ok) {
                console.error("Dahl API Error:", res.status, await res.text());
                process.exit(1);
              }

              const data = await res.json();
              const reply = data.choices?.[0]?.message?.content || "";
              const match = reply.match(/```file:memory\.json\n([\s\S]*?)```/);

              if (!match) {
                console.error("No valid memory.json block returned:", reply);
                process.exit(1);
              }

              const parsed = JSON.parse(match[1].trim());
              fs.writeFileSync("memory.json", JSON.stringify(parsed, null, 2) + "\n");
              console.log("AA01 memory.json validated and updated successfully.");
              process.exit(0);
            } catch (err) {
              console.error("Audit Execution Error:", err.message);
              process.exit(1);
            }
          }

          runAudit();
          '

      - name: Commit Verified AA01 Memory Back to Vault
        run: |
          git config user.name "Agent Anna AA01"
          git config user.email "aa01@agent-anna.local"
          git add memory.json
          if ! git diff --staged --quiet; then
            git commit -m "AA01 Autonomous Self-Audit: verified memory.json update"
            git push
          else
            echo "No changes to commit."
          fi
