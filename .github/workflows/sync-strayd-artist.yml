name: Sync Strayd Artist Page into A1/v3

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Live artist page URL to fetch"
        required: false
        default: "https://martinstrayd.github.io/artist/"
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  fetch-and-commit-artist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch live artist page, scripts, and track catalog
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://martinstrayd.github.io/artist/' }}
        run: |
          python3 - << 'EOF'
          import os, re, json, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from datetime import datetime, timezone

          url = os.environ.get("TARGET_URL", "https://martinstrayd.github.io/artist/").strip()

          def fetch_text(target):
              req = urllib.request.Request(target, headers={"User-Agent": "AgentAnnaV3-GitHubRunner/1.0"})
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return resp.status, resp.read().decode("utf-8", errors="replace")

          try:
              status, raw_html = fetch_text(url)
          except Exception as e:
              raise SystemExit(f"Fetch failed for {url}: {e}")

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.media = []
                  self.script_srcs = []
                  self.inline_scripts = []
                  self.text_chunks = []
                  self._in_script = False
                  self._skip_text = False
                  self._cur_href = None
                  self._cur_label = []
                  self._script_buf = []

              def handle_starttag(self, tag, attrs):
                  attr_map = dict(attrs)
                  if tag == "script":
                      self._in_script = True
                      self._skip_text = True
                      self._script_buf = []
                      src = attr_map.get("src", "").strip()
                      if src:
                          self.script_srcs.append(urljoin(url, src))
                  elif tag in ("style", "noscript"):
                      self._skip_text = True

                  if tag == "a" and "href" in attr_map:
                      self._cur_href = attr_map["href"].strip()
                      self._cur_label = []

                  for k in ("src", "href", "data-src", "poster"):
                      val = attr_map.get(k, "").strip()
                      if val:
                          full = urljoin(url, val)
                          self.media.append((tag, k, val, full))

              def handle_endtag(self, tag):
                  if tag == "script":
                      self._in_script = False
                      self._skip_text = False
                      code = "".join(self._script_buf).strip()
                      if code:
                          self.inline_scripts.append(code)
                      self._script_buf = []
                  elif tag in ("style", "noscript"):
                      self._skip_text = False

                  if tag == "a" and self._cur_href is not None:
                      label = " ".join("".join(self._cur_label).split())
                      full = urljoin(url, self._cur_href)
                      self.links.append({"label": label, "raw_href": self._cur_href, "url": full})
                      self._cur_href = None
                      self._cur_label = []

              def handle_data(self, data):
                  if self._in_script:
                      self._script_buf.append(data)
                      return
                  if self._skip_text:
                      return
                  cleaned = " ".join(data.split())
                  if cleaned:
                      self.text_chunks.append(cleaned)
                  if self._cur_href is not None:
                      self._cur_label.append(cleaned)

          parser = PageParser()
          parser.feed(raw_html)

          # Collect all JS/JSON text (inline + external scripts + discovered .json endpoints)
          all_code_blobs = list(parser.inline_scripts)
          fetched_sources = [url]

          candidate_urls = list(dict.fromkeys(parser.script_srcs))
          # Also check common catalog JSON paths relative to the artist URL
          for guess in ("tracks.json", "songs.json", "catalog.json", "data/tracks.json", "data/catalog.json", "assets/tracks.json"):
              candidate_urls.append(urljoin(url, guess))

          visited_code_urls = set()
          while candidate_urls:
              c_url = candidate_urls.pop(0)
              if c_url in visited_code_urls:
                  continue
              visited_code_urls.add(c_url)
              try:
                  c_status, c_text = fetch_text(c_url)
                  if c_status == 200 and c_text.strip():
                      all_code_blobs.append(c_text)
                      fetched_sources.append(c_url)
                      # Look for any .json references inside fetched JS files
                      for rel_json in re.findall(r"""['"]([^'"\s]+\.json(?:\?[^'"\s]*)?)['"]""", c_text, flags=re.IGNORECASE):
                          resolved = urljoin(c_url, rel_json)
                          if resolved not in visited_code_urls:
                              candidate_urls.append(resolved)
              except Exception:
                  pass

          combined_code = "\n\n".join(all_code_blobs)

          # Extract track objects from JSON or JS object literals
          tracks = []
          seen_track_keys = set()

          def add_track(item):
              if not isinstance(item, dict):
                  return
              title = (
                  item.get("title")
                  or item.get("name")
                  or item.get("song")
                  or item.get("track")
                  or item.get("trackTitle")
                  or ""
              )
              audio = (
                  item.get("audio")
                  or item.get("mp3")
                  or item.get("audioUrl")
                  or item.get("songUrl")
                  or item.get("file")
                  or item.get("src")
                  or item.get("url")
                  or ""
              )
              art = (
                  item.get("art")
                  or item.get("cover")
                  or item.get("image")
                  or item.get("img")
                  or item.get("coverUrl")
                  or item.get("artUrl")
                  or item.get("artwork")
                  or ""
              )
              track_id = item.get("id") or item.get("catalogId") or item.get("number") or item.get("index") or ""
              folder = item.get("folder") or item.get("dir") or item.get("path") or ""

              title_str = str(title).strip()
              audio_str = str(audio).strip()
              art_str = str(art).strip()
              if not (title_str or audio_str or art_str):
                  return
              if not (title_str and (audio_str or art_str or track_id != "")):
                  return

              full_audio = urljoin(url, audio_str) if audio_str else ""
              full_art = urljoin(url, art_str) if art_str else ""
              key = (str(track_id), title_str, full_audio, full_art)
              if key in seen_track_keys:
                  return
              seen_track_keys.add(key)
              tracks.append({
                  "id": str(track_id).strip(),
                  "title": title_str,
                  "folder": str(folder).strip(),
                  "audio_raw": audio_str,
                  "audio_url": full_audio,
                  "art_raw": art_str,
                  "art_url": full_art
              })

          # 1. Try parsing whole JSON blobs
          for blob in all_code_blobs:
              stripped = blob.strip()
              if stripped.startswith(("[", "{")):
                  try:
                      parsed = json.loads(stripped)
                      if isinstance(parsed, list):
                          for entry in parsed:
                              add_track(entry)
                      elif isinstance(parsed, dict):
                          for v in parsed.values():
                              if isinstance(v, list):
                                  for entry in v:
                                      add_track(entry)
                  except Exception:
                      pass

          # 2. Extract JS object literals containing title/name + audio/mp3/art/cover/image
          obj_pattern = re.compile(r"\{[^{}]{10,1200}\}", re.DOTALL)
          for match in obj_pattern.findall(combined_code):
              if not re.search(r"""\b(?:title|name|song|track)\b\s*:""", match):
                  continue
              if not re.search(r"""\b(?:audio|mp3|art|cover|image|img|file|src|url|id)\b\s*:""", match):
                  continue

              def extract_field(field_names):
                  for fn in field_names:
                      m = re.search(rf"""(?:['"]?{fn}['"]?)\s*:\s*(['"])(.*?)\1""", match, re.DOTALL)
                      if m:
                          return m.group(2).strip()
                      m_num = re.search(rf"""(?:['"]?{fn}['"]?)\s*:\s*(\d+)""", match)
                      if m_num:
                          return m_num.group(1).strip()
                  return ""

              add_track({
                  "id": extract_field(["id", "catalogId", "number", "num", "no"]),
                  "title": extract_field(["title", "name", "song", "track", "trackTitle"]),
                  "folder": extract_field(["folder", "dir", "path"]),
                  "audio": extract_field(["audio", "mp3", "audioUrl", "songUrl", "file", "src", "url"]),
                  "art": extract_field(["art", "cover", "image", "img", "coverUrl", "artUrl", "artwork"])
              })

          # 3. Extract all direct media/asset paths found anywhere in HTML or JS
          asset_exts = (".mp3", ".wav", ".ogg", ".flac", ".png", ".jpg", ".jpeg", ".webp", ".svg", ".avif", ".json", ".md", ".zip", ".mp4")
          files_and_folders = []
          seen_paths = set()

          raw_asset_refs = [m[2] for m in parser.media]
          raw_asset_refs += re.findall(r"""['"]([^'"\s]+\.(?:mp3|wav|ogg|flac|png|jpg|jpeg|webp|svg|avif|zip|mp4))['"]""", combined_code, flags=re.IGNORECASE)

          for raw_val in raw_asset_refs:
              full_url = urljoin(url, raw_val)
              parsed = urlparse(full_url)
              path = parsed.path or ""
              if path and path not in seen_paths:
                  seen_paths.add(path)
                  folder = "/".join(path.split("/")[:-1]) or "/"
                  filename = path.split("/")[-1] or "(folder)"
                  if path.lower().endswith(asset_exts) or filename == "(folder)":
                      files_and_folders.append({
                          "folder": folder,
                          "filename": filename,
                          "raw": raw_val,
                          "url": full_url
                      })

          seen_urls = set()
          unique_links = []
          for item in parser.links:
              key = (item["label"], item["url"])
              if key not in seen_urls:
                  seen_urls.add(key)
                  unique_links.append(item)

          now_iso = datetime.now(timezone.utc).isoformat()
          os.makedirs("A1/v3/knowledge", exist_ok=True)

          payload = {
              "source_url": url,
              "http_status": status,
              "fetched_at_utc": now_iso,
              "inspected_sources": fetched_sources,
              "tracks_count": len(tracks),
              "files_and_folders_count": len(files_and_folders),
              "links_count": len(unique_links),
              "tracks": tracks,
              "files_and_folders": files_and_folders,
              "links": unique_links,
              "visible_text": "\n".join(parser.text_chunks)
          }

          with open("A1/v3/knowledge/strayd-artist-live.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)

          md_lines = [
              "# STRAYD ARTIST LIVE SNAPSHOT (VERIFIED FETCH + SCRIPT CATALOG)",
              f"- Source URL: {url}",
              f"- HTTP Status: {status}",
              f"- Fetched At (UTC): {now_iso}",
              f"- Inspected Sources: {', '.join(fetched_sources)}",
              f"- Extracted Song/Track Entries: {len(tracks)}",
              f"- Extracted Art/Song Files & Folders: {len(files_and_folders)}",
              f"- Extracted Page Links: {len(unique_links)}",
              "",
              "## EXTRACTED SONGS / SINGLES / ART & AUDIO PATHS"
          ]
          if tracks:
              for idx, t in enumerate(tracks, 1):
                  tid = t["id"] or f"{idx:03d}"
                  parts = [f"#{tid}: **{t['title']}**"]
                  if t["folder"]:
                      parts.append(f"Folder: `{t['folder']}`")
                  if t["audio_url"]:
                      parts.append(f"Audio: {t['audio_url']} (`{t['audio_raw']}`)")
                  if t["art_url"]:
                      parts.append(f"Art: {t['art_url']} (`{t['art_raw']}`)")
                  md_lines.append("- " + " | ".join(parts))
          else:
              md_lines.append("- No structured track objects matched in inline/external scripts.")

          md_lines.extend(["", "## EXTRACTED FOLDERS & FILE NAMES (ART / SINGLES / ASSETS)"])
          if files_and_folders:
              for entry in files_and_folders:
                  md_lines.append(f"- Folder: `{entry['folder']}` | File: `{entry['filename']}` | URL: {entry['url']}")
          else:
              md_lines.append("- None detected.")

          md_lines.extend(["", "## EXTRACTED PAGE LINKS"])
          if unique_links:
              for l in unique_links:
                  lbl = l["label"] or "(no label)"
                  md_lines.append(f"- {lbl}: {l['url']} (raw: `{l['raw_href']}`)")
          else:
              md_lines.append("- None detected.")

          md_lines.extend(["", "## VERIFIED VISIBLE PAGE TEXT", "\n".join(parser.text_chunks)])

          with open("A1/v3/knowledge/strayd-artist-live.md", "w", encoding="utf-8") as f:
              f.write("\n".join(md_lines) + "\n")

          print(f"Saved {len(tracks)} tracks, {len(files_and_folders)} files/folders, and {len(unique_links)} links.")
          EOF

      - name: Commit updated Strayd artist knowledge files
        run: |
          git config user.name "Agent Anna V3 Bot"
          git config user.email "agent-anna@users.noreply.github.com"
          git add A1/v3/knowledge/strayd-artist-live.md A1/v3/knowledge/strayd-artist-live.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync live Strayd artist catalog, links, and files into A1/v3/knowledge"
            git push
          fi
