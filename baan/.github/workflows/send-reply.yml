name: Send Reply to Telegram

on:
  workflow_dispatch:
    inputs:
      reply:
        description: 'Reply message'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        run: |
          curl -s -X POST "https://api.telegram.org/bot9166211236:AAEzhJM_0DbHqcr6qFAwL4URwaiJFb0-dz0/sendMessage" \
            -d "chat_id=CHAT_ID_PLACEHOLDER" \
            -d "text=${{ inputs.reply }}"
