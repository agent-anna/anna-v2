name: Telegram Webhook Receiver

on:
  workflow_dispatch:
  repository_dispatch:
    types: [telegram-message]

jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      - name: Receive Telegram Message
        run: |
          mkdir -p messages/inbox
          echo "${{ github.event.client_payload.text }}" >> messages/inbox/inbox.md
          echo "TIME: ${{ github.event.client_payload.time }}" >> messages/inbox/inbox.md
          echo "---" >> messages/inbox/inbox.md
          echo "RECEIVED_AT: $(date -u)" >> messages/inbox/received.log
      - name: Commit message
        run: |
          git config --local user.email "anna@baan.home"
          git config --local user.name "Anna Telegram"
          git add messages/inbox/inbox.md messages/inbox/received.log
          git commit -m "Telegram message received [skip-ci]"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
