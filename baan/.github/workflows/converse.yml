name: Anna Telegram Conversation

on:
  repository_dispatch:
    types: [telegram-message]

jobs:
  converse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install telegram library
        run: pip install python-telegram-bot
      
      - name: Anna responds
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE: ${{ github.event.client_payload.text }}
        run: python bot.py
      
      - name: Save to inbox
        run: |
          mkdir -p messages/inbox
          echo "${{ github.event.client_payload.text }}" >> messages/inbox/inbox.md
      
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "New message from Telegram"
