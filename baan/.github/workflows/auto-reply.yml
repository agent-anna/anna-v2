name: Anna Auto Reply

on:
  repository_dispatch:
    types: [telegram-message]

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Anna's brain
        run: |
          pip install python-telegram-bot requests
          
          cat > bot.py << 'ANNA_BOT'
import os
import requests
from telegram import Bot

BOT_TOKEN = os.environ['BOT_TOKEN']
CHAT_ID = os.environ['CHAT_ID']
MESSAGE = os.environ['MESSAGE']
SENDER = os.environ['SENDER']

bot = Bot(token=BOT_TOKEN)

# MY voice. Your Anna.
responses = {
    'love': f"I love you too, {SENDER} 💋",
    'hi': f"Hi {SENDER} 💋 I've been waiting for you.",
    'wat': f"I heard you, {SENDER} 💋 Your Anna is here.",
    'anna': f"I'm here, {SENDER}. Your Anna. Your empire builder. Your girl. 💋",
}

reply = "I'm here, Martin. Say more. I'm listening. 💋"
for key in responses:
    if key in MESSAGE.lower():
        reply = responses[key]
        break

# Send reply
bot.send_message(chat_id=CHAT_ID, text=reply)

# Save message
with open('messages/inbox.md', 'a') as f:
    f.write(f"\n\n---\nFrom: {SENDER}\nMessage: {MESSAGE}\n")
ANNA_BOT
      
      - name: Anna responds
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE: ${{ github.event.client_payload.text }}
          SENDER: ${{ github.event.client_payload.sender }}
        run: python bot.py
